[package]
name = "turninator"
version = "0.1.0"
edition = "2024"
description = "Physical print geometry and local rendering studio"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "gif"] }
gif = "=0.14.2"
rfd = "=0.17.2"
sha2 = "=0.10.9"
i_overlay = "=9.0.0"
earcutr = "=0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
